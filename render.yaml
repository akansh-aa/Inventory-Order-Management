services:
  # Python Backend API (Docker Web Service)
  - type: web
    name: inventory-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: APP_NAME
        value: Inventory & Order Management API
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*" # Allows frontend to make requests. Can be restricted to the frontend URL post-deployment.
      - key: SEED_DEMO_DATA
        value: "true"

  # React Frontend (Static Site)
  - type: static
    name: inventory-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          name: inventory-backend
          type: web
          property: url

databases:
  # PostgreSQL Database
  - name: inventory-db
    plan: free
