services:
  # Unified Web Service (FastAPI Backend serving React Frontend)
  - type: web
    name: inventory-app
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: APP_NAME
        value: Inventory & Order Management System
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*" # Fallback, though requests are same-origin in production
      - key: SEED_DEMO_DATA
        value: "true"

databases:
  # PostgreSQL Database
  - name: inventory-db
    plan: free

